<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NestJS SSE Demo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>NestJS SSE Demo</h1>
        <div class="status" id="status" data-state="connecting">
          <span class="dot"></span>
          <span id="status-text">Connecting...</span>
          <span class="clients" id="clients"></span>
        </div>
      </header>

      <section class="panel">
        <h2>Send data</h2>
        <form id="send-form" autocomplete="off">
          <label for="message">Message</label>
          <input
            id="message"
            name="message"
            type="text"
            placeholder="Hello World"
            required
          />

          <label for="type">Type</label>
          <input id="type" name="type" type="text" value="notification" />

          <button id="send-button" type="submit">Send event</button>
        </form>
        <p class="send-status" id="send-status" role="status"></p>
        <p class="hint">
          The form POSTs JSON to <code>/events</code>. The backend broadcasts it
          to every connected <code>EventSource</code> client over
          <code>GET /events</code>.
        </p>
      </section>

      <section class="panel">
        <h2>Received events (<span id="event-count">0</span>)</h2>
        <ul class="events" id="events">
          <li class="empty">No events received yet.</li>
        </ul>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
